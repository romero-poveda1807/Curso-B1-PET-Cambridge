<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PET B1 Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: colourful hero + 3 coloured section cards; theory = sidebar index + article with a coloured title band; every topic group has its own hue */
:root {
  --paper: #f2f4fb;
  --surface: #ffffff;
  --ink: #0f1a33;
  --muted: #556079;
  --line: #d8ddec;
  --mark: #f3e84a;
  --mark-soft: #fbf5b8;
  --ok: #107a4a;
  --bad: #c0281c;
  --blue: #2a43f0;   --blue-s: #e3e8ff;
  --violet: #7a3ff0; --violet-s: #eee5ff;
  --pink: #d91a6c;   --pink-s: #ffe2ef;
  --orange: #d4550a; --orange-s: #ffe8d4;
  --green: #0b8450;  --green-s: #d6f4e5;
  --teal: #0a7f92;   --teal-s: #d3f1f6;
  --red: #cf2f24;    --red-s: #ffe0dc;
  --on-c: #ffffff;
  --hero-a: #2a43f0; --hero-b: #7a3ff0;
  --accent: var(--blue);
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b1120; --surface: #141c33; --ink: #e8ecf7; --muted: #a3acc4; --line: #2a3452;
    --mark: #8a7f12; --mark-soft: #2f2c0e; --ok: #4cd197; --bad: #ff8a7e;
    --blue: #8fa1ff; --blue-s: #1b2350; --violet: #b79bff; --violet-s: #2a1f55; --pink: #ff7ab3; --pink-s: #4a1530;
    --orange: #ffa05a; --orange-s: #4a2a10; --green: #4cd197; --green-s: #0f3a29; --teal: #4cc9dc; --teal-s: #0d3a43;
    --red: #ff8a7e; --red-s: #4a1d19; --on-c: #0b1120; --hero-a: #2f3fc4; --hero-b: #5d2fb8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b1120; --surface: #141c33; --ink: #e8ecf7; --muted: #a3acc4; --line: #2a3452;
  --mark: #8a7f12; --mark-soft: #2f2c0e; --ok: #4cd197; --bad: #ff8a7e;
  --blue: #8fa1ff; --blue-s: #1b2350; --violet: #b79bff; --violet-s: #2a1f55; --pink: #ff7ab3; --pink-s: #4a1530;
  --orange: #ffa05a; --orange-s: #4a2a10; --green: #4cd197; --green-s: #0f3a29; --teal: #4cc9dc; --teal-s: #0d3a43;
  --red: #ff8a7e; --red-s: #4a1d19; --on-c: #0b1120; --hero-a: #2f3fc4; --hero-b: #5d2fb8;
  color-scheme: dark;
}
.c-blue { --c: var(--blue); --cs: var(--blue-s); }
.c-violet { --c: var(--violet); --cs: var(--violet-s); }
.c-pink { --c: var(--pink); --cs: var(--pink-s); }
.c-orange { --c: var(--orange); --cs: var(--orange-s); }
.c-green { --c: var(--green); --cs: var(--green-s); }
.c-teal { --c: var(--teal); --cs: var(--teal-s); }
.c-red { --c: var(--red); --cs: var(--red-s); }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--paper); color: var(--ink); font: 17px/1.6 var(--font-body); }
a { color: var(--accent); }
h1, h2, h3, h4, h5 { font-family: var(--font-display); text-wrap: balance; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
p { margin: 0 0 0.8em; max-width: 72ch; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.wrap { width: 100%; max-width: 1180px; margin-inline: auto; padding-inline: 16px; }
#app.enter { animation: rise .4s ease-out backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 3px solid transparent; border-image: linear-gradient(90deg, var(--blue), var(--violet), var(--pink), var(--orange), var(--green)) 1; }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 8px 20px; flex-wrap: wrap; padding-block: 10px; }
.logo { font: 800 1.4rem/1 var(--font-display); text-decoration: none; color: var(--ink); display: flex; align-items: center; gap: 8px; letter-spacing: -0.02em; }
.logo b { background: var(--mark); padding: 2px 8px 3px; border-radius: 4px; color: #0f1a33; transform: rotate(-3deg); display: inline-block; }
.logo small { font: 700 0.7rem/1 var(--font-body); color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--ink); font: 700 0.85rem/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 14px; border-radius: 999px; transition: background .15s; }
.nav a:hover { background: var(--paper); }
.nav a[data-sec="theory"][aria-current] { background: var(--blue); color: var(--on-c); }
.nav a[data-sec="exams"][aria-current] { background: var(--pink); color: var(--on-c); }
.nav a[data-sec="lessons"][aria-current] { background: var(--green); color: var(--on-c); }

main { padding-bottom: 64px; }
main > .wrap:first-child { padding-top: 28px; }
.eyebrow { font: 700 0.75rem/1 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: block; }
.eyebrow.light { color: rgba(255,255,255,.85); }
.page-title { font-size: clamp(2.1rem, 5vw, 3.3rem); font-weight: 800; margin-bottom: 12px; text-transform: uppercase; }
.lead { font-size: 1.15rem; }
.lead.light { color: #fff; }
.hl { background: var(--mark-soft); padding: 0 4px; border-radius: 3px; font-weight: 700; }
.cta { display: inline-flex; align-items: center; gap: 8px; background: var(--c, var(--blue)); color: var(--on-c); font-weight: 700; padding: 12px 20px; border-radius: 999px; text-decoration: none; border: 0; transition: transform .15s, box-shadow .15s; }
.cta:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.cta.big { background: #fff; color: #1d2fb8; font-size: 1.05rem; padding: 14px 24px; }

/* home */
.hero2 { position: relative; overflow: hidden; background: linear-gradient(120deg, var(--hero-a), var(--hero-b)); color: #fff; padding-block: 44px 52px; }
.hero-in { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.hero2 h1 { font-size: clamp(2.8rem, 8.5vw, 5.4rem); font-weight: 800; line-height: .98; text-transform: uppercase; }
.hero2 h1 mark { background: var(--mark); color: #0f1a33; padding: 0 .12em; border-radius: 6px; display: inline-block; transform: rotate(-2deg); }
.blob { position: absolute; border-radius: 50%; opacity: .9; animation: float 9s ease-in-out infinite; }
.blob.b1 { width: 220px; height: 220px; background: #ff4f9a; right: -50px; top: -70px; opacity: .55; }
.blob.b2 { width: 120px; height: 120px; background: #ffb23f; left: 42%; bottom: -50px; animation-delay: -3s; opacity: .7; }
.blob.b3 { width: 80px; height: 80px; background: #2fe0a8; left: 6%; top: 18px; animation-delay: -6s; opacity: .55; }
@keyframes float { 50% { transform: translateY(-16px) rotate(8deg); } }
.hero-card { background: var(--surface); color: var(--ink); border-radius: 16px; padding: 18px; display: grid; gap: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.25); }
.rwrap { display: flex; align-items: center; gap: 14px; }
.rwrap b { display: block; font: 800 1.5rem/1 var(--font-display); }
.rwrap span { color: var(--muted); }
.ring { width: 84px; height: 84px; flex: none; }
.ring circle { fill: none; stroke-width: 9; }
.ring .rb { stroke: var(--line); }
.ring .rf { stroke: var(--green); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dasharray .6s; }
.ring text { font: 800 17px var(--font-display); fill: var(--ink); }
.facts { display: grid; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; overflow: hidden; }
.facts div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: .95rem; }
.facts div:last-child { border-bottom: 0; }
.facts span { color: var(--muted); }
.facts b { font-variant-numeric: tabular-nums; text-align: right; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 16px; margin-top: -26px; position: relative; z-index: 2; }
.card { background: var(--c); color: var(--on-c); border-radius: 14px; padding: 24px; text-decoration: none; display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: transform .2s, box-shadow .2s; animation: rise .5s ease-out backwards; animation-delay: calc(var(--i, 0) * 90ms + 150ms); box-shadow: 0 8px 22px rgba(0,0,0,.14); }
.card:hover { transform: translateY(-5px) rotate(-.4deg); box-shadow: 0 16px 34px rgba(0,0,0,.22); }
.card .eyebrow { color: inherit; opacity: .85; }
.card h2 { font-size: 2rem; text-transform: uppercase; }
.card p { margin: 0; opacity: .95; }
.card .go { margin-top: auto; font-weight: 700; }
.strip { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin-top: 18px; padding: 18px 24px; border-radius: 14px; background: var(--cs); border: 2px dashed var(--c); text-decoration: none; color: var(--ink); transition: transform .2s; }
.strip:hover { transform: scale(1.01); }
.strip b { font: 800 1.35rem var(--font-display); display: block; text-transform: uppercase; }
.strip .go { font-weight: 800; color: var(--c); }

/* theory index */
.group { margin-top: 30px; }
.group h2, .lgroup h2 { font-size: 1.55rem; margin-bottom: 12px; text-transform: uppercase; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; }
.group h2 i, .lgroup h2 i, .toc h4 i { width: 14px; height: 14px; border-radius: 4px; background: var(--c); display: inline-block; flex: none; transform: rotate(45deg); }
.tlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); gap: 10px; }
.tlist h5 { grid-column: 1 / -1; font: 800 .8rem/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--on-c); background: var(--c); padding: 6px 12px; border-radius: 999px; justify-self: start; margin-top: 8px; }
.tlist a { background: var(--cs); border-radius: 10px; padding: 13px 15px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 3px; min-width: 0; border: 2px solid transparent; transition: transform .15s, border-color .15s; }
.tlist a:hover { border-color: var(--c); transform: translateY(-3px); }
.tlist b { font: 700 1rem/1.2 var(--font-display); text-transform: uppercase; }
.tlist span { color: var(--muted); font-size: .9rem; }

/* theory topic */
.split { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 32px; align-items: start; }
.toc { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 100px); overflow-y: auto; padding-right: 8px; }
.toc h4 { font: 800 .75rem/1.3 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); margin: 18px 0 6px; display: flex; gap: 8px; align-items: center; }
.toc h4:first-child { margin-top: 0; }
.toc h5 { font: 700 .68rem/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--c); margin: 10px 10px 2px; }
.toc a { display: block; padding: 5px 10px; text-decoration: none; color: var(--ink); border-radius: 6px; font-size: .93rem; line-height: 1.35; text-transform: uppercase; letter-spacing: .02em; }
.toc a:hover { background: var(--surface); }
.toc a[aria-current="page"] { background: var(--mark); color: #0f1a33; font-weight: 800; }
.mtoc { display: none; margin-bottom: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.mtoc summary { padding: 12px 14px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: .06em; }
.mtoc .toc { position: static; max-height: 60vh; padding: 0 10px 12px; }

.article { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; overflow: hidden; }
.thead { background: var(--c); color: var(--on-c); padding: clamp(20px, 4vw, 34px); position: relative; overflow: hidden; }
.thead::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.16); }
.thead .eyebrow { color: inherit; opacity: .85; }
.thead h1 { font-size: clamp(1.9rem, 4.8vw, 3rem); font-weight: 800; text-transform: uppercase; position: relative; z-index: 1; }
.thead .sub { margin: 8px 0 0; font-size: 1.08rem; opacity: .95; position: relative; z-index: 1; }
.abody { padding: clamp(18px, 4vw, 38px); }
.abody h3 { font-size: 1.25rem; margin: 32px 0 10px; text-transform: uppercase; letter-spacing: .02em; color: var(--c); display: flex; align-items: center; gap: 10px; }
.abody h3::before { content: ""; width: 12px; height: 12px; background: var(--c); border-radius: 3px; transform: rotate(45deg); flex: none; }
.abody > h3:first-child { margin-top: 0; }
.abody ul, .abody ol { padding-left: 1.25em; margin: 0 0 1em; max-width: 72ch; }
.abody li { margin-bottom: .3em; }
.formula { display: inline-block; font: 600 .98rem/1.5 var(--font-mono); background: var(--c); color: var(--on-c); padding: 9px 16px; border-radius: 8px; max-width: 100%; overflow-wrap: anywhere; }
.exs { display: grid; gap: 8px; margin: 10px 0 18px; }
.ex { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 2px 20px; padding: 10px 14px; border-radius: 10px; background: var(--cs); }
.ex .en { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.ex .es { color: var(--muted); font-style: italic; min-width: 0; overflow-wrap: anywhere; }
.note { background: var(--mark-soft); border: 2px dashed var(--mark); border-radius: 10px; padding: 12px 16px; margin: 14px 0 8px; font-size: .98rem; max-width: 72ch; }
.tw { overflow-x: auto; margin: 12px 0 18px; border: 1px solid var(--line); border-radius: 10px; }
.tw.tall { max-height: 70vh; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; min-width: 30rem; font-size: .96rem; }
th { text-align: left; font: 800 .74rem/1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: var(--cs, var(--paper)); padding: 10px 12px; white-space: nowrap; position: sticky; top: 0; }
td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--cs, var(--paper)) 35%, transparent); }
td:first-child { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; max-width: none; }
.chips span { font: 600 .88rem/1 var(--font-mono); border-radius: 999px; padding: 7px 12px; background: var(--cs); }
ol.uses { list-style: none; padding: 0; counter-reset: u; display: grid; gap: 10px; max-width: none; }
ol.uses > li { counter-increment: u; position: relative; padding-left: 46px; margin: 0; }
ol.uses > li::before { content: counter(u); position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--c); color: var(--on-c); font: 800 .95rem/32px var(--font-display); text-align: center; }
ol.uses > li > b { display: block; margin-bottom: 4px; }
ol.uses .ex { margin-top: 2px; }
ol.freq { list-style: none; counter-reset: f; padding: 0; display: grid; gap: 6px; max-width: 34rem; }
ol.freq li { counter-increment: f; display: grid; grid-template-columns: 1.6em 11rem minmax(0, 1fr) auto; align-items: center; gap: 8px; margin: 0; font-size: .96rem; }
ol.freq li::before { content: counter(f); font: 800 .8rem var(--font-mono); color: var(--muted); }
ol.freq li b { font-weight: 700; }
ol.freq li i { height: 10px; border-radius: 99px; background: var(--cs); position: relative; overflow: hidden; }
ol.freq li i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: calc(var(--p) * 1%); background: var(--c); border-radius: 99px; }
ol.freq li span { font: 600 .78rem var(--font-mono); color: var(--muted); text-align: right; white-space: nowrap; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; flex-wrap: wrap; }
.pager a { flex: 1 1 14rem; text-decoration: none; background: var(--cs); border-radius: 10px; padding: 12px 16px; color: var(--ink); min-width: 0; text-transform: uppercase; font: 700 .95rem/1.3 var(--font-display); border: 2px solid transparent; transition: border-color .15s, transform .15s; }
.pager a:hover { border-color: var(--c); transform: translateY(-2px); }
.pager small { display: block; color: var(--muted); font: 700 .7rem var(--font-body); letter-spacing: .12em; }
.pager a.next { text-align: right; }
.slot { border: 2px dashed var(--c, var(--line)); border-radius: 12px; padding: 30px 20px; text-align: center; color: var(--muted); background: var(--cs, var(--surface)); }
.slot b { display: block; color: var(--ink); font: 700 1.2rem var(--font-display); margin-bottom: 4px; }
/* conditionals / passive tables */
.ct td.cc { font-weight: 700; text-align: center; background: var(--cs); vertical-align: middle; white-space: nowrap; border-right: 1px solid var(--line); }
.ct td.cr { font-weight: 700; white-space: nowrap; }
.ct tr.band td { background: var(--c); color: var(--on-c); text-transform: uppercase; letter-spacing: .12em; font: 800 .85rem var(--font-body); text-align: center; padding: 8px; border-top: 0; }
.ct .es, .es { color: var(--muted); font-style: italic; }
.pt td:first-child { white-space: nowrap; }

/* irregular verbs */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 16px; }
.tabs button { border: 2px solid var(--c); background: transparent; color: var(--ink); font-weight: 700; padding: 9px 18px; border-radius: 999px; }
.tabs button[aria-selected="true"] { background: var(--c); color: var(--on-c); }
.irr-tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 8px; }
.irr-tools input { font: inherit; flex: 1 1 18rem; padding: 10px 14px; border: 2px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink); }
.irr-tools span { color: var(--muted); font-weight: 600; }
table.irr { min-width: 40rem; }
table.irr small { font: 500 .78rem var(--font-mono); color: var(--muted); }
table.irr td:first-child { font-weight: 400; }
table.irr.game input { width: 100%; min-width: 7rem; font: inherit; padding: 5px 9px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
table.irr.game input.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
table.irr.game input.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
table.irr.game td.given { background: var(--c); color: var(--on-c); font: 800 1.05rem var(--font-display); vertical-align: middle; }
.sol { display: block; color: var(--ok); font-weight: 700; font-size: .88rem; }
.irr-game h3 { margin-top: 4px; }

/* exams */
.subnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 26px; }
.subnav a { text-decoration: none; padding: 9px 16px; background: var(--cs, var(--surface)); border-radius: 999px; font-weight: 700; color: var(--ink); font-size: .95rem; border: 2px solid transparent; }
.subnav a:not([class]) { background: var(--surface); border-color: var(--line); }
.subnav a[aria-current="page"] { background: var(--c, var(--ink)); color: var(--on-c, var(--surface)); }
.papers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 14px; margin: 16px 0 28px; }
.paper { background: var(--c); color: var(--on-c); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; min-width: 0; transition: transform .2s; animation: rise .5s ease-out backwards; animation-delay: calc(var(--i, 0) * 80ms); }
.paper:hover { transform: translateY(-4px) rotate(-.5deg); }
.paper h3 { font-size: 1.7rem; text-transform: uppercase; }
.paper .meta { opacity: .92; font-size: .92rem; }
.paper .w { font: 800 .85rem var(--font-mono); background: rgba(255,255,255,.22); align-self: flex-start; padding: 3px 9px; border-radius: 99px; }
.paper .go { margin-top: auto; font-weight: 700; }
.section-h { font-size: 1.5rem; margin: 34px 0 12px; text-transform: uppercase; }
.part { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 4px 18px; }
.part .pn { grid-row: span 3; width: 68px; height: 68px; border-radius: 16px; background: var(--c); color: var(--on-c); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.part .pn small { font: 800 .6rem/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; }
.part .pn b { font: 800 2rem/1 var(--font-display); }
.part h3 { font-size: 1.2rem; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.part h3 > span:last-child { font: 600 .85rem var(--font-mono); color: var(--muted); }
.part p { margin: 0; }
.part .tip { font-size: .95rem; color: var(--muted); }
.part .tip b { color: var(--c); }
.bubs { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.bubs i { font: 700 .66rem/1 var(--font-mono); font-style: normal; width: 24px; height: 16px; border: 2px solid var(--c); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--c); }
.bubs i:nth-child(1) { background: var(--c); color: var(--on-c); }
.disclaimer { font-size: .92rem; color: var(--muted); margin-top: 28px; }

/* lessons */
.progress-box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin: 18px 0 28px; display: grid; gap: 10px; }
.progress-box .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.progress-box .big { font: 800 2.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--green); }
.bar { height: 16px; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--violet), var(--pink), var(--orange), var(--green)); border-radius: 999px; transition: width .5s; }
.lgroup { margin-bottom: 30px; }
.lgroup h2 span { font: 600 .88rem var(--font-mono); color: var(--muted); text-transform: none; }
details.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
details.lesson > summary { padding: 13px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; list-style: none; font: 700 1rem var(--font-display); text-transform: uppercase; background: var(--cs); }
details.lesson > summary::-webkit-details-marker { display: none; }
details.lesson > summary::after { content: "+"; font: 400 1.5rem/1 var(--font-mono); color: var(--c); }
details.lesson[open] > summary::after { content: "–"; }
details.lesson .st { margin-left: auto; font: 700 .82rem var(--font-mono); background: var(--c); color: var(--on-c); padding: 3px 9px; border-radius: 99px; font-variant-numeric: tabular-nums; }
details.lesson.done .st { background: var(--ok); color: var(--on-c); }
.tasks { padding: 12px 16px 16px; display: grid; gap: 10px; }
.task { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); cursor: pointer; }
.task input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.task .lz { flex: none; width: 30px; height: 19px; border: 2.5px solid var(--c); border-radius: 50%; margin-top: 4px; transition: background .2s; }
.task input:checked + .lz { background: var(--c); }
.task input:focus-visible + .lz { outline: 3px solid var(--accent); outline-offset: 2px; }
.task input:checked ~ .tx { color: var(--muted); }
.task .tx { min-width: 0; }
.exercise { margin: 8px 0 4px 0; border-radius: 12px; padding: 14px; background: var(--cs); }
.exercise h4 { font-size: 1.05rem; margin-bottom: 8px; text-transform: uppercase; }
.qrow { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 7px 0; border-top: 1px solid color-mix(in srgb, var(--c) 25%, transparent); font-size: .98rem; }
.qrow:first-of-type { border-top: 0; }
.qrow .qn { font: 700 .8rem var(--font-mono); color: var(--muted); width: 2.2em; align-self: flex-start; padding-top: 4px; }
.qrow .qt { min-width: 0; flex: 1 1 18rem; }
.qrow .qb { flex: 1 1 18rem; display: grid; gap: 4px; min-width: 0; }
.qrow .es-q i { font: 800 .65rem var(--font-mono); font-style: normal; background: var(--c); color: var(--on-c); padding: 2px 6px; border-radius: 4px; margin-right: 6px; }
.qrow input { font: inherit; width: 11rem; max-width: 100%; padding: 4px 9px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.qrow.tr input { width: 100%; }
.qrow input.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
.qrow input.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.exbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 12px; }
.exbar button { border: 2px solid var(--c); background: var(--surface); border-radius: 999px; padding: 7px 16px; font-weight: 700; }
.exbar button.main { background: var(--c); color: var(--on-c); }
.exbar.top { margin: 6px 0 12px; }
.score { font-weight: 800; font-variant-numeric: tabular-nums; }
.hint { font-size: .88rem; color: var(--muted); margin: 8px 0 0; }

@media (max-width: 880px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .split > .toc { display: none; }
  .mtoc { display: block; }
  .hero-in { grid-template-columns: minmax(0, 1fr); }
  .part { grid-template-columns: minmax(0, 1fr); }
  .part .pn { grid-row: auto; width: 56px; height: 56px; }
  ol.freq li { grid-template-columns: 1.6em 8.5rem minmax(0, 1fr) auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

<script>
/* ---------- helpers ---------- */
const E = (en, es) => `<div class="ex"><span class="en">${en}</span><span class="es">${es}</span></div>`;
const EX = (...p) => `<div class="exs">${p.map(x => E(x[0], x[1])).join('')}</div>`;
const T = (head, rows) => `<div class="tw"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const F = t => `<p class="formula">${t}</p>`;
const NOTE = (t, ex) => `<aside class="note">${t}</aside>${ex ? EX(...ex) : ''}`;
const H = t => `<h3>${t}</h3>`;
const P = t => `<p>${t}</p>`;
const LEAD = t => `<p class="lead">${t}</p>`;
const UL = (...i) => `<ul>${i.map(x => `<li>${x}</li>`).join('')}</ul>`;
const OL = (...i) => `<ol>${i.map(x => `<li>${x}</li>`).join('')}</ol>`;
const CH = (...i) => `<p class="chips">${i.map(x => `<span>${x}</span>`).join('')}</p>`;
const HL = t => `<span class="hl">${t}</span>`;
/* ordered list of uses, each with an example: USES([use, en, es], ...) */
const USES = (...u) => `<ol class="uses">${u.map(x => `<li><b>${x[0]}</b>${E(x[1], x[2])}</li>`).join('')}</ol>`;
/* ordered list of frequency adverbs (always the same order, from most to least frequent) */
const FREQ_ALL = [
  ['always', '100%'], ['constantly / continually', '≈100% (often a complaint)'], ['usually', '90%'], ['normally / generally', '80%'],
  ['often / frequently', '70%'], ['sometimes', '50%'], ['occasionally', '30%'], ['rarely / seldom', '10%'], ['hardly ever', '5%'], ['never', '0%']
];
const FQ = (keep, en, es, extra) => {
  const rows = FREQ_ALL.filter(r => keep === 'all' || keep.includes(r[0].split(' ')[0]));
  return H('Frequency adverbs, from most to least frequent') +
    `<ol class="freq">${rows.map(r => `<li><b>${r[0]}</b><i style="--p:${parseInt(r[1].replace('≈',''))}"></i><span>${r[1].replace(' (often a complaint)','')}</span></li>`).join('')}</ol>` +
    (en ? EX([en, es]) : '') + (extra || '');
};
const TIMES = (...i) => H('Time expressions and signal words') + CH(...i);

const GROUPS = [];
/* ---------- BASICS ---------- */
GROUPS.push({ id: 'basics', name: 'Grammar basics', hue: 'blue', topics: [
{ id: 'saxon-genitive', title: 'Saxon genitive', sub: "Showing who something belongs to: 's",
  task: "Write 6 sentences with the Saxon genitive: one with a plural owner ending in -s, one with two owners sharing something and one where each owner has their own thing.",
  html:
LEAD('We use the Saxon genitive to show that something belongs to someone. The owner must be a <b>living being</b>: a person or an animal.') +
H('Basic form') +
P(`Add ${HL("'s")} to the owner and then write the thing owned. The order is the opposite of Spanish.`) +
F("owner + 's + thing owned") +
EX(["Paul's table", 'La mesa de Paul'], ["My sister's dog", 'El perro de mi hermana']) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['Plural owner ending in -s', "Add only the apostrophe (')", "My bosses' car (El coche de mis jefes)"],
  ['Irregular plural not ending in -s', "Add 's as normal", "The children's toys (Los juguetes de los niños)"],
  ['Singular name ending in -s', "Both 's and ' are correct", "James's car / James' car (El coche de James)"],
  ['Two owners, one shared thing', "Add 's only to the last owner", "Susan and Peter's car (El coche de Susan y Peter, compartido)"],
  ['Two owners, each with their own thing', "Add 's to each owner", "Susan's and Peter's cars (Los coches de Susan y de Peter)"],
  ['Places and shops', "'s without the noun", "We met at Tom's. / I'm going to the baker's. (Quedamos en casa de Tom. / Voy a la panadería.)"],
  ['Time expressions', "'s is also correct", "Today's newspaper / a week's holiday (El periódico de hoy / una semana de vacaciones)"]]) +
H('Things (non-living owners)') +
P('With objects we do not use the Saxon genitive. We use <b>of</b> or a compound noun.') +
EX(['The leg of the table', 'La pata de la mesa'], ['The car door', 'La puerta del coche'])
},
{ id: 'personal-pronouns', title: 'Personal pronouns', sub: 'Subject, object, possessive and reflexive forms',
  task: 'Write all five forms of the pronouns from memory in a table. Then write one sentence with each form for the person "she".',
  html:
LEAD('Personal pronouns replace nouns. Their form changes according to the function they have in the sentence.') +
T(['Subject', 'Object', 'Possessive adjective', 'Possessive pronoun', 'Reflexive'], [
  ['I', 'me', 'my', 'mine', 'myself'],
  ['you', 'you', 'your', 'yours', 'yourself'],
  ['he', 'him', 'his', 'his', 'himself'],
  ['she', 'her', 'her', 'hers', 'herself'],
  ['it', 'it', 'its', '—', 'itself'],
  ['we', 'us', 'our', 'ours', 'ourselves'],
  ['you', 'you', 'your', 'yours', 'yourselves'],
  ['they', 'them', 'their', 'theirs', 'themselves']]) +
H('Subject pronouns') +
P('They go before the verb. In English the subject is always necessary, even with weather and time.') +
EX(['She lives in Valencia.', 'Vive en Valencia.'], ['It is raining.', 'Está lloviendo.']) +
H('Object pronouns') +
P('They go after a verb or a preposition.') +
EX(['Can you help me?', '¿Puedes ayudarme?'], ['I saw them at the cinema.', 'Los vi en el cine.'], ['This present is for you.', 'Este regalo es para ti.']) +
H('Possessive adjectives and possessive pronouns') +
P('A possessive <b>adjective</b> goes before a noun. A possessive <b>pronoun</b> replaces the noun and is never followed by one.') +
EX(['This is my bag.', 'Este es mi bolso.'], ['This bag is mine.', 'Este bolso es mío.'], ['Their house is bigger than ours.', 'Su casa es más grande que la nuestra.']) +
H('Reflexive pronouns') +
P('We use them when the subject and the object are the same person, and to emphasise (&ldquo;by myself&rdquo;).') +
EX(['He cut himself with a knife.', 'Se cortó con un cuchillo.'], ['I made this cake myself.', 'Hice esta tarta yo mismo.']) +
H('Exceptions and special cases') +
T(['Case', 'Explanation', 'Example'], [
  ['its / it\'s', 'its = possessive (no apostrophe); it\'s = it is / it has', "The dog wagged its tail. It's happy. (El perro movió la cola. Está contento.)"],
  ['you', 'Same form for singular and plural', "You are my best friend. / You are all welcome. (Eres mi mejor amigo. / Sois todos bienvenidos.)"],
  ['Possessives with body parts', 'English uses the possessive adjective, not the article', "She washed her hands. (Se lavó las manos.)"],
  ['a friend of mine', 'of + possessive pronoun, never "of my"', "He is a friend of mine. (Es amigo mío.)"],
  ['Reflexive vs object', 'Same person = reflexive; different person = object', "He hurt himself. / He hurt him. (Se hizo daño. / Le hizo daño a él.)"]])
},
{ id: 'a-an', title: 'A / AN', sub: 'Indefinite articles',
  task: 'Write 10 nouns with the correct article (a / an). Include at least two words with a silent h and two with a /j/ sound.',
  html:
LEAD('<b>A</b> and <b>an</b> mean &ldquo;one&rdquo;. We only use them with <b>singular countable nouns</b>.') +
T(['We use', 'When the word starts with', 'Examples'], [
  ['<b>a</b>', 'a consonant sound', 'a book, a dog, a teacher'],
  ['<b>an</b>', 'a vowel sound', 'an apple, an egg, an idea']]) +
H('It is the sound, not the letter') +
T(['Word', 'Initial sound', 'Article'], [
  ['horse', '/h/ is pronounced (consonant)', 'a horse'],
  ['hour', '/h/ is silent: starts with a vowel sound', 'an hour'],
  ['honest', '/h/ is silent', 'an honest man'],
  ['uniform', '/j/ (&ldquo;yu&rdquo;) sounds like a consonant', 'a uniform'],
  ['university', '/j/', 'a university'],
  ['European country', '/j/', 'a European country'],
  ['umbrella', '/ʌ/ is a vowel sound', 'an umbrella'],
  ['one-day trip', '/w/', 'a one-day trip']]) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['Letters read as a name', 'Use the sound of the letter name', 'an MP (/em/), an FBI agent (/ef/), a UFO (/juː/)'],
  ['Adjective before the noun', 'The sound of the adjective decides', 'a big apple, an old house'],
  ['Jobs', 'Use a / an with professions', 'She is a doctor. (Es médica.)'],
  ['Frequency and speed', 'a / an = per', 'twice a week (dos veces por semana), 60 km an hour (60 km por hora)'],
  ['Plural and uncountable nouns', 'No a / an: use some or nothing', 'I need some water. / I like books. (Necesito agua. / Me gustan los libros.)']])
},
{ id: 'quantifiers', title: 'Quantifiers', sub: 'the, some, any, a lot of, many, much',
  task: 'Write one affirmative sentence, one negative sentence and one question with each of these: some/any, many, much, a lot of. Then write 2 questions with How many and 2 with How much.',
  html:
LEAD('Quantifiers tell us <b>how much</b> or <b>how many</b>. First we need to know if the noun is <b>countable</b> (apple, apples) or <b>uncountable</b> (water, money, information).') +
H('The') +
P(`${HL('The')} means &ldquo;that specific thing&rdquo;: we already know which one, or there is only one.`) +
EX(['Open the window, please.', 'Abre la ventana, por favor.'], ['The sun is hot today.', 'El sol está fuerte hoy.']) +
H('Some and any') +
T(['', 'Use', 'Example'], [
  ['<b>some</b>', 'Affirmative sentences', 'There are some apples on the table. (Hay unas manzanas en la mesa.)'],
  ['<b>any</b>', 'Negative sentences and questions', "We haven't got any milk. / Is there any sugar? (No tenemos leche. / ¿Hay azúcar?)"]]) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['Offers and requests', 'Use <b>some</b> in questions when we expect &ldquo;yes&rdquo;', 'Would you like some tea? (¿Te apetece un té?)'],
  ['<b>any</b> in affirmative sentences', 'Means &ldquo;it does not matter which&rdquo;', 'You can take any book. (Puedes coger cualquier libro.)'],
  ['<b>any</b> after a negative word', 'Hardly, never, without also take any', 'He never has any money. (Nunca tiene dinero.)']]) +
H('A lot of / lots of') +
P('They mean &ldquo;a large quantity&rdquo;. They work with <b>countable and uncountable</b> nouns, mainly in affirmative sentences.') +
EX(['She has a lot of friends.', 'Tiene muchos amigos.'], ['We have lots of homework.', 'Tenemos muchos deberes.']) +
H('Many and much') +
T(['', 'Used with', 'Used in', 'Example'], [
  ['<b>many</b>', 'Countable (plural)', 'Negatives and questions', "There aren't many cars. / Are there many people? (No hay muchos coches. / ¿Hay mucha gente?)"],
  ['<b>much</b>', 'Uncountable', 'Negatives and questions', "I don't have much time. / Is there much traffic? (No tengo mucho tiempo. / ¿Hay mucho tráfico?)"]]) +
NOTE('<b>Exception:</b> in affirmative sentences <i>much</i> is only normal after <i>so, too, as</i> and <i>very</i>. Otherwise use <i>a lot of</i>.', [['She has so much energy.', 'Tiene muchísima energía.'], ['I have a lot of time.', 'Tengo mucho tiempo. (not: I have much time)']]) +
H('How many…? and How much…?') +
T(['', 'We ask about', 'Example'], [
  ['<b>How many…?</b>', 'Countable things', 'How many brothers have you got? (¿Cuántos hermanos tienes?)'],
  ['<b>How much…?</b>', 'Uncountable things and prices', 'How much water do you drink? / How much is this shirt? (¿Cuánta agua bebes? / ¿Cuánto cuesta esta camisa?)']])
},
{ id: 'there-is-are', title: 'There is / There are', sub: 'Saying that something exists (present)',
  task: 'Describe your bedroom with 6 sentences with there is / there are: two affirmative, two negative and two questions with their short answers.',
  html:
LEAD(`${HL('There is / There are')} say that something <b>exists or is in a place</b>. We use <i>is</i> with singular and uncountable nouns and <i>are</i> with plural nouns.`) +
T(['', 'Singular countable', 'Uncountable', 'Plural countable'], [
  ['<b>Affirmative</b>', 'There is a book on the desk.', 'There is some milk in the fridge.', 'There are some books on the desk.'],
  ['<b>Negative</b>', "There isn't a book.", "There isn't any milk.", "There aren't any books."],
  ['<b>Question</b>', 'Is there a book?', 'Is there any milk?', 'Are there any books?'],
  ['<b>Short answers</b>', "Yes, there is. / No, there isn't.", "Yes, there is. / No, there isn't.", "Yes, there are. / No, there aren't."]]) +
EX(['There is a park near my house.', 'Hay un parque cerca de mi casa.'], ["There aren't any shops here.", 'No hay tiendas aquí.'], ['Is there any water?', '¿Hay agua?']) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['Contraction', "There is → there's. There are has no contraction.", "There's a cat. / There are two cats. (Hay un gato. / Hay dos gatos.)"],
  ['Several things in a list', 'The verb agrees with the first noun', 'There is a pen and two books on the desk. (Hay un bolígrafo y dos libros en el escritorio.)'],
  ['Spoken English', "There's is often used before plurals", "There's three people waiting. (Hay tres personas esperando.)"],
  ['Not the same as "it is"', 'There is = exists. It is = identifies.', "There is a bus. It is red. (Hay un autobús. Es rojo.)"]])
},
{ id: 'there-was-were', title: 'There was / There were', sub: 'Saying that something existed (past)',
  task: 'Describe your primary school or your old neighbourhood with 6 sentences with there was / there were: two affirmative, two negative and two questions with short answers.',
  html:
LEAD('<b>There was / There were</b> is the past of <i>there is / there are</i>. We use <i>was</i> with singular and uncountable nouns and <i>were</i> with plural nouns.') +
T(['', 'Singular countable', 'Uncountable', 'Plural countable'], [
  ['<b>Affirmative</b>', 'There was a dog in the garden.', 'There was some milk in the fridge.', 'There were some dogs in the garden.'],
  ['<b>Negative</b>', "There wasn't a dog.", "There wasn't any milk.", "There weren't any dogs."],
  ['<b>Question</b>', 'Was there a dog?', 'Was there any milk?', 'Were there any dogs?'],
  ['<b>Short answers</b>', "Yes, there was. / No, there wasn't.", "Yes, there was. / No, there wasn't.", "Yes, there were. / No, there weren't."]]) +
EX(['There was a big storm last night.', 'Anoche hubo una gran tormenta.'], ["There weren't any tickets left.", 'No quedaban entradas.'], ['Was there any bread?', '¿Había pan?']) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['No auxiliary <i>did</i>', 'Questions and negatives use was / were, never did', "Was there a party? (not: Did there be…) (¿Hubo una fiesta?)"],
  ['Used to', 'There used to be = there was in the past, but not now', 'There used to be a cinema here. (Antes había un cine aquí.)'],
  ['Mixed list', 'The verb agrees with the first noun', 'There was a table and two chairs. (Había una mesa y dos sillas.)']])
},
{ id: 'demonstratives', title: 'Demonstratives', sub: 'this, that, these, those',
  task: 'Look around you and write 6 sentences: three with this/these (near) and three with that/those (far).',
  html:
LEAD('Demonstratives point to something. They show <b>distance</b> from the speaker and <b>number</b>.') +
T(['', 'Near', 'Far'], [
  ['<b>Singular</b>', 'this (este / esta / esto)', 'that (ese / esa / eso, aquel / aquella / aquello)'],
  ['<b>Plural</b>', 'these (estos / estas)', 'those (esos / esas, aquellos / aquellas)']]) +
EX(['This pen is mine.', 'Este bolígrafo es mío.'], ['That house is very old.', 'Esa casa es muy vieja.'], ['These shoes are comfortable.', 'Estos zapatos son cómodos.'], ['Those mountains are beautiful.', 'Aquellas montañas son preciosas.']) +
H('As pronouns') +
EX(['What is that?', '¿Qué es eso?'], ['Are these your keys?', '¿Son estas tus llaves?']) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['Time expressions', 'this = present; that = past or finished', 'I am busy this week. / That was a great weekend. (Esta semana estoy ocupado. / Aquello fue un gran fin de semana.)'],
  ['On the phone', 'this = me, that = you', 'Hello, this is Anna. Who is that? (Hola, soy Anna. ¿Quién es?)'],
  ['Emotional distance', 'that can show we do not like something near us', "I don't like that noise. (No me gusta ese ruido.)"],
  ['Pairs of objects', 'These / those with trousers, jeans, glasses', 'Those jeans are too long. (Esos vaqueros son demasiado largos.)']])
},
{ id: 'plurals', title: 'Singular and plural', sub: 'Regular and irregular plural nouns',
  task: 'Write the plural of 20 nouns, at least 8 of them irregular. Then use 5 of them in sentences.',
  html:
LEAD('Most nouns form the plural with a few simple rules. Irregular plurals must be memorised.') +
H('Regular rules') +
T(['Rule', 'Examples'], [

  task: 'Write 6 pairs of sentences contrasting what you usually do with what you are doing differently this week.',
  html:
LEAD('Choose the tense according to the <b>meaning</b>: is it a routine or a fact, or is it happening now or temporarily?') +
T(['', 'Present simple', 'Present continuous'], [
  ['<b>Meaning</b>', 'Habit, routine, fact', 'Happening now, temporary'],
  ['<b>Form</b>', 'work / works', 'am, is, are + working'],
  ['<b>Signals</b>', 'always, usually, every day, never', 'now, at the moment, today, these days'],
  ['<b>Example</b>', 'He walks to school. (Va andando al colegio.)', 'He is driving to school today. (Hoy va en coche al colegio.)']]) +
EX(['She usually drinks tea, but today she is drinking coffee.', 'Normalmente toma té, pero hoy está tomando café.'], ['I play tennis on Saturdays. I am playing now.', 'Juego al tenis los sábados. Estoy jugando ahora.'], ["Water freezes at 0 degrees. Look, it's freezing!", 'El agua se congela a 0 grados. ¡Mira, se está congelando!']) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['Stative verbs', 'They stay in the present simple even if it is happening now', 'I want a coffee now. (not: I am wanting) (Ahora quiero un café.)'],
  ['Always', 'present simple = neutral; present continuous = annoyed', "He always arrives late. / He is always arriving late! (Siempre llega tarde. / ¡Siempre está llegando tarde!)"],
  ['Future', 'Present continuous = arrangement; present simple = timetable', "I'm leaving at six. / The train leaves at six. (Me voy a las seis. / El tren sale a las seis.)"]])
},

/* ===== PAST ===== */
{ id: 'past-simple', sec: 'Past', hue: 'pink', title: 'Past simple', sub: 'Finished actions in the past',
  task: 'Write a paragraph of 8 sentences about what you did last weekend. Include 2 negatives and 2 questions with short answers.',
  html:
LEAD('The past simple describes <b>finished actions</b> at a definite time in the past and <b>sequences</b> of past events.') +
H('Form') +
T(['', 'All persons'], [
  ['<b>Affirmative</b>', 'I worked / I went'],
  ['<b>Negative</b>', "I didn't work / I didn't go"],
  ['<b>Question</b>', 'Did you work? / Where did you go?'],
  ['<b>Short answers</b>', "Yes, I did. / No, I didn't."]]) +
NOTE('After <i>did</i> and <i>didn\'t</i> the main verb goes back to the <b>base form</b>.', [['Did she go to the party?', '¿Fue ella a la fiesta?'], ["She didn't go to the party. (not: didn't went)", 'No fue a la fiesta.']]) +
H('Uses') +
USES(
  ['Finished action at a definite time', 'We visited my grandmother yesterday.', 'Visitamos a mi abuela ayer.'],
  ['Sequence of events (stories)', 'He opened the door, looked inside and smiled.', 'Abrió la puerta, miró dentro y sonrió.'],
  ['Past habits and states that are over', 'I lived in Madrid when I was a child.', 'Viví en Madrid de niño.'],
  ['Finished periods of time (ago, last…, in 2019)', 'They moved here two years ago.', 'Se mudaron aquí hace dos años.']) +
H('Regular verbs: spelling of -ed') +
T(['Rule', 'Examples'], [
  ['Normal: add <b>-ed</b>', 'work → worked (We worked all day. Trabajamos todo el día.)'],
  ['Ends in -e: add <b>-d</b>', 'like → liked, live → lived (I liked it. Me gustó.)'],
  ['Consonant-vowel-consonant: double the consonant', 'stop → stopped, plan → planned (The bus stopped. El autobús paró.)'],
  ['Consonant + y → <b>-ied</b>', 'study → studied, cry → cried (She cried. Lloró.)'],
  ['Vowel + y: just add -ed', 'play → played, enjoy → enjoyed (We enjoyed it. Lo disfrutamos.)']]) +
P('For irregular past forms (went, saw, bought…), see the topic IRREGULAR VERBS.') +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['The verb <i>be</i>', 'No <i>did</i>: use was / were', "Were you at home? / I wasn't there. (¿Estabas en casa? / No estaba allí.)"],
  ['Subject questions', 'No <i>did</i> when the question word is the subject', 'Who called you? (not: Who did call you) (¿Quién te llamó?)'],
  ['Can and modals', 'No <i>did</i>: could / couldn\'t', "I couldn't open it. (No pude abrirlo.)"],
  ['Emphasis', 'Did + base verb in an affirmative sentence', 'I did tell you! (¡Sí que te lo dije!)']]) +
FQ('all', 'When I was young, I often played football.', 'De joven, jugaba a menudo al fútbol.') +
TIMES('yesterday', 'last week', 'two days ago', 'in 2019', 'when I was a child', 'then', 'at that time')
},
{ id: 'past-continuous', sec: 'Past', hue: 'pink', title: 'Past continuous', sub: 'Actions in progress in the past',
  task: 'Write what you and your family were doing at 9 pm yesterday (5 sentences) and 3 sentences with when / while describing an interruption.',
  html:
LEAD('The past continuous describes actions <b>in progress at a specific moment in the past</b>, the <b>background</b> of a story, and actions that were <b>interrupted</b>.') +
H('Form') +
F('was / were + verb-ing') +
T(['', 'Example'], [
  ['<b>Affirmative</b>', 'I was sleeping. / They were playing.'],
  ['<b>Negative</b>', "I wasn't sleeping. / They weren't playing."],
  ['<b>Question</b>', 'Were you sleeping? / What were they doing?'],
  ['<b>Short answers</b>', "Yes, I was. / No, they weren't."]]) +
H('Uses') +
USES(
  ['An action in progress at a specific moment in the past', "At eight o'clock yesterday I was having dinner.", 'Ayer a las ocho estaba cenando.'],
  ['Background description in a story', 'It was raining and people were running home.', 'Llovía y la gente corría a casa.'],
  ['Two actions in progress at the same time (while)', 'While she was cooking, he was watching TV.', 'Mientras ella cocinaba, él veía la tele.'],
  ['An action interrupted by another (past simple)', 'I was walking home when it started to rain.', 'Iba andando a casa cuando empezó a llover.'],
  ['Annoying past habits (always)', 'He was always borrowing my things.', 'Siempre me estaba cogiendo mis cosas.']) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['Stative verbs', 'No continuous: use past simple', 'I knew the answer. (not: I was knowing) (Sabía la respuesta.)'],
  ['Spelling', 'The same rules as the present continuous', 'run → running, make → making (She was making tea. Estaba preparando té.)'],
  ['Completed actions', 'Use past simple for a whole action', 'I read the book yesterday. (Leí el libro ayer.) / I was reading the book at 8. (Estaba leyendo el libro a las 8.)']]) +
FQ(['always', 'constantly', 'often'], 'She was always complaining.', 'Siempre se estaba quejando.') +
TIMES("at 8 o'clock yesterday", 'while', 'when', 'all day', 'all evening', 'at that moment', 'at that time')
},
{ id: 'past-perfect', sec: 'Past', hue: 'pink', title: 'Past perfect', sub: 'The past before the past',
  task: 'Write 6 sentences with two past actions each, using before, after, by the time or when. Use the past perfect for the earlier action.',
  html:
LEAD('The past perfect is for an action that happened <b>before another action or moment in the past</b>.') +
H('Form') +
F('had + past participle') +
T(['', 'Example'], [
  ['<b>Affirmative</b>', 'I had finished. / She had left.'],
  ['<b>Negative</b>', "I hadn't finished. / She hadn't left."],
  ['<b>Question</b>', 'Had you finished? / Had she left?'],
  ['<b>Short answers</b>', "Yes, I had. / No, she hadn't."]]) +
H('Uses') +
USES(
  ['An action completed before another past action or time', 'When I arrived, the film had already started.', 'Cuando llegué, la película ya había empezado.'],
  ['The reason for a past situation', 'She was sad because she had lost her phone.', 'Estaba triste porque había perdido el móvil.'],
  ['With after, before, by the time', 'After they had eaten, they went for a walk.', 'Después de comer, dieron un paseo.'],
  ['In reported speech and in the third conditional', 'He said he had seen her.', 'Dijo que la había visto.']) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['Sequence vs earlier action', 'One after another = past simple. Earlier action = past perfect.', 'When I arrived, he left. (He left after.) / When I arrived, he had left. (He was gone before.)'],
  ['before / after', 'With before and after the past simple is also correct', 'After they ate, they left. / After they had eaten, they left. (Después de comer, se fueron.)'],
  ['Not with a definite time', 'No past perfect when the time is given and the order is clear', 'I got up at 7. (not: I had got up at 7) (Me levanté a las 7.)'],
  ['By the time', 'by the time + past simple → past perfect', 'By the time we arrived, they had gone. (Para cuando llegamos, se habían ido.)']]) +
FQ(['always', 'often', 'sometimes', 'rarely', 'never'], 'I had never seen snow before that day.', 'Nunca había visto nieve antes de ese día.') +
TIMES('before', 'after', 'when', 'by the time', 'already', 'until', 'just', 'never … before', 'by then')
},
{ id: 'past-perfect-continuous', sec: 'Past', hue: 'pink', title: 'Past perfect continuous', sub: 'Duration before a past moment',
  task: 'Write 5 sentences explaining the reason for a past situation (He was tired because he had been…) and 3 with for / since.',
  html:
LEAD('The past perfect continuous shows that an action had been <b>in progress for some time before</b> another moment or action in the past. It often gives the <b>reason</b> for a past situation.') +
H('Form') +
F('had + been + verb-ing') +
T(['', 'Example'], [
  ['<b>Affirmative</b>', 'I had been waiting for an hour.'],
  ['<b>Negative</b>', "She hadn't been sleeping well."],
  ['<b>Question</b>', 'How long had they been walking?'],
  ['<b>Short answers</b>', "Yes, I had. / No, they hadn't."]]) +
H('Uses') +
USES(
  ['An action in progress up to a past moment (duration)', 'When he arrived, we had been waiting for two hours.', 'Cuando llegó, llevábamos dos horas esperando.'],
  ['The cause of a past situation', 'She was tired because she had been studying all night.', 'Estaba cansada porque había estado estudiando toda la noche.'],
  ['Visible evidence in the past', 'The ground was wet. It had been raining.', 'El suelo estaba mojado. Había estado lloviendo.']) +
H('Past perfect or past perfect continuous?') +
EX(['I had read the book. (finished)', 'Había leído el libro.'], ['I had been reading the book. (duration, maybe unfinished)', 'Llevaba un rato leyendo el libro.']) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['Stative verbs', 'Use the past perfect simple', 'I had known him for years. (not: had been knowing) (Lo conocía desde hacía años.)'],
  ['Counting', 'Use the simple form for numbers of times', 'She had read three books. (Había leído tres libros.)']]) +
FQ(['always', 'constantly', 'often'], 'He had always been dreaming of travelling.', 'Siempre había estado soñando con viajar.') +
TIMES('for', 'since', 'all day', 'how long…', 'before', 'by the time', 'until then')
},
{ id: 'used-to', sec: 'Past', hue: 'pink', title: 'Used to', sub: 'Past habits and past states',
  task: 'Write 6 sentences about how your life was different 10 years ago, with used to. Include 2 negatives and 2 questions with short answers.',
  html:
LEAD('We use <b>used to</b> for <b>past habits</b> and <b>past states</b> that are not true now.') +
T(['', 'Form', 'Example'], [
  ['<b>Affirmative</b>', 'subject + used to + base verb', 'I used to play football.'],
  ['<b>Negative</b>', "subject + didn't use to + base verb", "She didn't use to like fish."],
  ['<b>Question</b>', 'Did + subject + use to + base verb?', 'Did you use to live here?'],
  ['<b>Short answers</b>', "Yes, I did. / No, I didn't.", '']]) +
H('Uses') +
USES(
  ['Past habits (repeated actions)', 'We used to go to the beach every summer.', 'Íbamos a la playa todos los veranos.'],
  ['Past states', 'There used to be a cinema here.', 'Antes había un cine aquí.'],
  ['Contrast between past and present', "He didn't use to wear glasses.", 'Antes no llevaba gafas.']) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['Spelling in negatives and questions', 'use to (without -d), because did carries the past', 'Did you use to have long hair? (¿Solías tener el pelo largo?)'],
  ['Would for habits', 'Would can replace used to for repeated actions, never for states', 'We would visit my aunt every Sunday. (Visitábamos a mi tía cada domingo.) / I used to have a dog. (not: I would have a dog) (Tenía un perro.)'],
  ['Exact number of times', 'No used to: use the past simple', 'I went there three times. (not: I used to go there three times) (Fui allí tres veces.)'],
  ['Be used to + -ing', 'Different meaning: to be accustomed to', 'I am used to getting up early. / I used to get up late. (Estoy acostumbrado a madrugar. / Antes me levantaba tarde.)']]) +
FQ(['always', 'often', 'sometimes', 'never'], 'I never used to eat vegetables.', 'Antes nunca comía verduras.')
},
{ id: 'past-simple-vs-continuous', sec: 'Past', hue: 'pink', title: 'Past simple vs past continuous', sub: 'Interrupted actions and background',
  task: 'Write a short story of 8 sentences using both tenses, with at least 3 sentences with when and 3 with while.',
  html:
LEAD('The <b>past continuous</b> gives the <b>background</b> or the long action in progress. The <b>past simple</b> gives the <b>main events</b> or the short action that interrupts.') +
T(['', 'Past simple', 'Past continuous'], [
  ['<b>Role</b>', 'Finished event, new action', 'Background, action in progress'],
  ['<b>Duration</b>', 'Short, complete', 'Longer, unfinished at that moment'],
  ['<b>With</b>', 'when + short action', 'while + long action']]) +
EX(['I was watching TV when the phone rang.', 'Veía la tele cuando sonó el teléfono.'], ['While she was walking home, she saw an accident.', 'Mientras caminaba a casa, vio un accidente.'], ['He fell asleep while he was reading.', 'Se quedó dormido mientras leía.']) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['Two tenses, two meanings', 'The tense changes who did it first', 'When I arrived, they were having dinner. (They were already eating.) / When I arrived, they had dinner. (First I arrived, then they ate.)'],
  ['Two long actions at the same time', 'Both continuous with while', 'While I was cooking, he was studying. (Mientras yo cocinaba, él estudiaba.)'],
  ['A series of completed actions', 'Past simple only', 'She got up, had a shower and left. (Se levantó, se duchó y se fue.)'],
  ['Stative verbs', 'Past simple even for a long state', 'I knew the answer while he was speaking. (Yo sabía la respuesta mientras él hablaba.)']])
},

/* ===== FUTURE ===== */
{ id: 'will', sec: 'Future', hue: 'orange', title: 'Will', sub: 'Decisions, predictions, promises',
  task: 'Write 8 sentences with will: two spontaneous decisions, two predictions, two promises and two offers. Add 2 questions.',
  html:
LEAD('<b>Will</b> is used to talk about the future when there is no plan yet, or to give an opinion, a promise or an offer.') +
H('Form') +
F('will + base verb (same form for all persons)') +
T(['', 'Example'], [
  ['<b>Affirmative</b>', "I will help you. / I'll help you."],
  ['<b>Negative</b>', "She will not (won't) come."],
  ['<b>Question</b>', 'Will you help me? / When will they arrive?'],
  ['<b>Short answers</b>', "Yes, I will. / No, I won't."]]) +
H('Uses') +
USES(
  ['Spontaneous decisions', "I'm hungry. I'll make a sandwich.", 'Tengo hambre. Voy a hacerme un bocadillo.'],
  ['Predictions based on opinion', 'I think she will pass the exam.', 'Creo que aprobará el examen.'],
  ['Promises', 'I promise I will call you.', 'Te prometo que te llamaré.'],
  ['Offers and requests', "I'll carry that for you.", 'Te lo llevo yo.'],
  ['Warnings and threats', "Be careful or you'll fall.", 'Ten cuidado o te caerás.'],
  ['Facts about the future', 'Tomorrow will be Tuesday.', 'Mañana será martes.']) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['After if / when / as soon as', 'No will in the time or condition clause: use the present simple', "I'll call you when I get home. (not: when I will get home) (Te llamaré cuando llegue a casa.)"],
  ['Shall', 'Shall + I / we for offers and suggestions', 'Shall we go? (¿Nos vamos?)'],
  ['Contractions', "I will → I'll; will not → won't", "They won't come. (No vendrán.)"]]) +
FQ(['always', 'usually', 'often', 'sometimes', 'never'], "I will always remember this day.", 'Siempre recordaré este día.') +
TIMES('I think', 'I hope', 'I expect', 'probably', 'perhaps', 'maybe', 'tomorrow', 'next week', 'soon', 'in 2030')
},
{ id: 'future-continuous', sec: 'Future', hue: 'orange', title: 'Future continuous', sub: 'In progress at a future time',
  task: 'Write 6 sentences about what you will be doing at specific times next week (this time tomorrow, at 8 pm on Friday…). Add 2 questions with Will you be…?',
  html:
LEAD('The future continuous describes an action that will be <b>in progress at a specific time in the future</b>.') +
H('Form') +
F('will + be + verb-ing') +
T(['', 'Example'], [
  ['<b>Affirmative</b>', "I will be working. / I'll be working."],
  ['<b>Negative</b>', "She won't be working."],
  ['<b>Question</b>', 'Will you be working? / What will he be doing?'],
  ['<b>Short answers</b>', "Yes, I will. / No, she won't."]]) +
H('Uses') +
USES(
  ['An action in progress at a specific future time', 'This time tomorrow I will be flying to Rome.', 'Mañana a esta hora estaré volando a Roma.'],
  ['Events that will happen in the normal course of things', "Don't call at eight. We'll be having dinner.", 'No llames a las ocho. Estaremos cenando.'],
  ['Polite questions about someone\'s plans', 'Will you be using the car tonight?', '¿Vas a usar el coche esta noche?'],
  ['Two actions in progress at the same time in the future', 'I will be cooking while you are working.', 'Yo estaré cocinando mientras tú trabajas.']) +
H('Future simple or future continuous?') +
T(['', 'Will + verb', 'Will be + -ing'], [
  ['<b>Meaning</b>', 'Decision, prediction, promise', 'Action in progress at a future moment'],
  ['<b>Example</b>', "I'll call you at 8. (Te llamaré a las 8.)", "At 8 I'll be having dinner. (A las 8 estaré cenando.)"]]) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['Stative verbs', 'No continuous: use will + base verb', "I'll know the results on Monday. (not: I'll be knowing) (El lunes sabré los resultados.)"],
  ['After when / while / as', 'Present simple or present continuous in the time clause', 'I will be sleeping when you arrive. (Estaré durmiendo cuando llegues.)']]) +
FQ(['always', 'usually', 'often', 'sometimes'], 'I will always be waiting for you.', 'Siempre te estaré esperando.') +
TIMES('this time tomorrow', 'at 8 pm tomorrow', 'next week at this time', 'in two hours', 'all day tomorrow', 'by this time next year')
},
{ id: 'going-to', sec: 'Future', hue: 'orange', title: 'Be going to', sub: 'Plans and evidence',
  task: 'Write 5 sentences about your plans for next year and 3 predictions based on things you can see around you now.',
  html:
LEAD('We use <b>be going to</b> for <b>plans and intentions</b> already decided, and for <b>predictions based on evidence</b> we can see now.') +
H('Form') +
F('am / is / are + going to + base verb') +
T(['', 'Example'], [
  ['<b>Affirmative</b>', "I'm going to study. / She's going to travel."],
  ['<b>Negative</b>', "I'm not going to study. / They aren't going to come."],
  ['<b>Question</b>', 'Are you going to study? / What is she going to do?'],
  ['<b>Short answers</b>', "Yes, I am. / No, she isn't."]]) +
H('Uses') +
USES(
  ['Plans and intentions decided before speaking', "I'm going to learn the guitar this year.", 'Voy a aprender guitarra este año.'],
  ['Predictions based on present evidence', "Look at those clouds. It's going to rain.", 'Mira esas nubes. Va a llover.'],
  ['Something that is about to happen', 'Watch out! You are going to fall!', '¡Cuidado! ¡Te vas a caer!']) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['Verbs of movement', 'With go and come we prefer the present continuous', "I'm going to the cinema. / She's coming tomorrow. (Voy al cine. / Viene mañana.)"],
  ['Past intentions', 'was / were going to = a plan that did not happen', 'I was going to call you, but I forgot. (Iba a llamarte, pero se me olvidó.)'],
  ['Speech', 'In speech going to often sounds like gonna (informal)', "I'm gonna leave. (Me voy a ir.)"]]) +
FQ(['always', 'never'], "I'm never going to give up.", 'Nunca voy a rendirme.') +
TIMES('tomorrow', 'next year', 'this summer', 'tonight', 'soon', 'in a few days', 'later')
},
{ id: 'will-vs-going-to', sec: 'Future', hue: 'orange', title: 'Will vs be going to', sub: 'Decision now or plan already made?',
  task: 'Write 6 pairs of sentences: first a plan (going to) and then a spontaneous reaction (will) in the same situation.',
  html:
LEAD('Both refer to the future. The difference is <b>when the decision was made</b> and the <b>evidence</b> we have.') +

  ['<b>Also</b>', 'Promises, offers, warnings', 'Plans and intentions'],

EX(["— We have no milk. — OK, I'll go to the shop.", '— No tenemos leche. — Vale, iré a la tienda.'], ["I've decided: I'm going to study medicine.", 'Lo he decidido: voy a estudiar medicina.'], ["Careful! You're going to fall!", '¡Cuidado! ¡Te vas a caer!'], ['I think it will be a great party.', 'Creo que será una gran fiesta.']) +
H('Exceptions and special cases') +
T(['Case', 'Rule', 'Example'], [
  ['Opinion + evidence', 'I think + will for opinion; going to for evidence', "I think it will be sunny. / Look, it's going to be sunny. (Creo que hará sol. / Mira, va a hacer sol.)"],
  ['Promises and offers', 'Only will', "I'll help you. (not: I'm going to help you) (Te ayudaré.)"],

{ id: 'present-continuous-future', sec: 'Future', hue: 'orange', title: 'Present continuous for the future', sub: 'Fixed arrangements',
  task: 'Write your diary for next week with 6 fixed arrangements (who, what, when) using the present continuous. Then write 2 sentences using the present simple for timetables.',

USES(

}

/* ---------- GERUND AND INFINITIVE ---------- */
GROUPS.push({ id: 'gerund-infinitive', name: 'Gerund and infinitive', hue: 'green', topics: [
{ id: 'gerund-infinitive', title: 'Gerund and infinitive', sub: 'Verb + -ing or verb + to?',

  html:
LEAD('When one verb follows another, the second verb can be a <b>gerund</b> (verb + <i>-ing</i>) or an <b>infinitive</b> (<i>to</i> + base verb). Which one we use depends on the first verb, the preposition or the adjective before it.') +
H('The gerund (verb + -ing)') +
USES(

/* answer matching: contractions are treated as equal to their long forms */
const PRON = new Set(['he', 'she', 'it', 'that', 'there', 'what', 'who', 'where', 'how', 'here', '']);
function norm(s) { return s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, ' ').replace(/[.!?,;:]+$/, '').trim(); }
function variants(raw) {
  let s = norm(raw).replace(/\bcannot\b/g, 'can not').replace(/\bwon't\b/g, 'will not').replace(/\bshan't\b/g, 'shall not')
    .replace(/n't\b/g, ' not').replace(/'m\b/g, ' am').replace(/'re\b/g, ' are').replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will').replace(/\blet's\b/g, 'let us');
  const toks = s.split(' ').filter(Boolean);
  let out = [[]];
  toks.forEach(t => {
    let alts = [t], m;
    if ((m = t.match(/^(\w*)'s$/)) && PRON.has(m[1])) alts = [(m[1] + ' is').trim(), (m[1] + ' has').trim()];
    else if ((m = t.match(/^(\w*)'d$/))) alts = [(m[1] + ' would').trim(), (m[1] + ' had').trim()];
    const next = [];
    out.forEach(o => alts.forEach(a => { if (next.length < 32) next.push(o.concat(a)); }));
    out = next;
  });
  return out.map(o => o.join(' ').replace(/\s+/g, ' ').trim());
}
function matches(user, answers) {
  const u = variants(user);
  return answers.some(a => variants(a).some(v => u.includes(v)));
}

let irrTab = 'list', irrRound = null;
const stripP = s => s.replace(/\s*\(.*?\)/g, '');
function irrGen() {

function irrCell(v, c) { return [v.v1, v.v2, v.v3, v.es][c]; }
function irrListHTML() {

  </tbody></table></div>`;
}
function irrChallengeHTML() {
  if (!irrRound) irrGen();
  return `<div class="irr-game"><h3>Fill the row</h3><p>Every row shows <b>one</b> form. Fill in the other three. In the Spanish column any correct translation counts. Press <b>New table</b> for 25 different verbs.</p>
  <div class="exbar top"><button class="main" data-irr="check">Check</button><button data-irr="show">Show answers</button><button data-irr="new">New table</button><span class="score" id="irr-score" aria-live="polite"></span></div>
  <div class="tw tall"><table class="irr game"><thead><tr><th>V1</th><th>V2</th><th>V3</th><th>Castellano</th></tr></thead><tbody>
  ${irrRound.map((r, ri) => `<tr>${[0, 1, 2, 3].map(c => c === r.c ? `<td class="given">${irrCell(IRR[r.i], c)}</td>` : `<td><input type="text" data-r="${ri}" data-c="${c}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${['Base form', 'Past simple', 'Past participle', 'Spanish'][c]} of ${IRR[r.i].v1}"><span class="sol" hidden></span></td>`).join('')}</tr>`).join('')}
  </tbody></table></div></div>`;
}
function irregularView() {
  return `<p class="lead">Many English verbs have irregular past forms. Learn them by heart: you need them for the past simple, the present perfect, the past perfect and the passive voice.</p>
  <div class="tabs" role="tablist"><button role="tab" data-irr="tab-list" aria-selected="${irrTab === 'list'}">The list (${IRR.length})</button><button role="tab" data-irr="tab-game" aria-selected="${irrTab === 'game'}">Fill the row challenge</button></div>
  <div id="irr-body">${irrTab === 'list' ? irrListHTML() : irrChallengeHTML()}</div>`;
}
function irrAnswers(c, v) {
  const raw = irrCell(v, c);
  let parts = [stripP(raw)];
  raw.split(/\s*[\/,;]\s*/).forEach(p => parts.push(stripP(p)));
  if (c === 3) raw.split(/\s*[,;]\s*/).forEach(p => { parts.push(p.replace(/\(se\)/g, '')); parts.push(p.replace(/\((se)\)/g, '$1')); });
  if (c !== 3 && / up$/.test(raw)) parts.push(raw.replace(/ up$/, ''));
  if (c !== 3) parts.push(raw.replace(/\s*\/\s*/g, '/'));
  return parts.map(p => p.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')).filter(Boolean);
}
function irrCheck(show) {
  let ok = 0, tot = 0;
  document.querySelectorAll('#irr-body input').forEach(inp => {
    const r = irrRound[+inp.dataset.r], c = +inp.dataset.c, v = IRR[r.i];
    const ans = irrAnswers(c, v), val = inp.value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s*\/\s*/g, '/');
    const good = ans.includes(val); tot++;
    if (good) ok++;
    inp.classList.toggle('ok', good && val !== ''); inp.classList.toggle('bad', !good && val !== '');
    const sol = inp.nextElementSibling;
    if (show) { sol.hidden = false; sol.textContent = irrCell(v, c); } else if (good) sol.hidden = true;
  });
  document.getElementById('irr-score').textContent = ok + ' of ' + tot + ' correct';
  if (!show && ok >= 60) { done.add('irr-challenge'); saveDone(); }
}

  const sec = section(h);
  document.querySelectorAll('.nav a').forEach(a => { if (a.dataset.sec === sec) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (target) { const el = document.querySelector(`[data-lid="${target}"]`); if (el) { el.open = true; el.scrollIntoView(); window.scrollBy(0, -80); } else window.scrollTo(0, 0); }
  else window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

/* ---------- interaction ---------- */
function updateProgress(taskId) {
  const l = ALL_LESSONS.find(x => x.tasks.some(t => t.id === taskId));
  const d = document.querySelector(`details[data-lid="${l.id}"]`);
  if (!d) return;
  const dn = l.tasks.filter(t => done.has(t.id)).length;
  d.querySelector('.st').textContent = dn + '/' + l.tasks.length;
  d.classList.toggle('done', dn === l.tasks.length);
  const grp = LESSONS.find(g => g.lessons.includes(l)), gt = grp.lessons.flatMap(x => x.tasks);
  d.closest('.lgroup').querySelector('h2 span').textContent = gt.filter(t => done.has(t.id)).length + '/' + gt.length;
  const n = doneCount(), total = ALL_TASKS.length, pct = Math.round(n / total * 100);
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('pcount').textContent = n + ' of ' + total + ' tasks completed';
  document.getElementById('pbar').style.width = pct + '%';
  document.querySelector('[role=progressbar]').setAttribute('aria-valuenow', pct);
}
document.addEventListener('change', e => {
  const cb = e.target.closest('[data-task]');
  if (!cb) return;
  if (cb.checked) done.add(cb.dataset.task); else done.delete(cb.dataset.task);
  saveDone(); updateProgress(cb.dataset.task);
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.matches && d.matches('details.lesson')) { if (d.open) openLessons.add(d.dataset.lid); else openLessons.delete(d.dataset.lid); }
}, true);
document.addEventListener('input', e => {
  if (e.target.id === 'irr-filter') {
    const q = e.target.value.trim().toLowerCase(); let n = 0;
    document.querySelectorAll('.irr tbody tr').forEach(r => { const show = !q || r.dataset.s.includes(q); r.hidden = !show; if (show) n++; });
    document.getElementById('irr-count').textContent = n + ' verbs';
  }
});
document.addEventListener('click', e => {
  const g = e.target.closest('[data-irr]');
  if (g) {
    const a = g.dataset.irr;
    if (a === 'tab-list' || a === 'tab-game') { irrTab = a === 'tab-list' ? 'list' : 'game'; render(); return; }
    if (a === 'new') { irrGen(); document.getElementById('irr-body').innerHTML = irrChallengeHTML(); return; }
    if (a === 'check') irrCheck(false);
    if (a === 'show') irrCheck(true);
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const box = b.closest('.exercise'), key = box.dataset.ex, items = getExercise(key).items;
  const rows = [...box.querySelectorAll('.qrow')], act = b.dataset.act;
  if (act === 'check') {
    let ok = 0;
    rows.forEach((r, i) => {
      const inp = r.querySelector('input'), good = matches(inp.value, items[i].a.split('|'));
      inp.classList.toggle('ok', good); inp.classList.toggle('bad', !good && inp.value.trim() !== '');
      if (good) ok++;
    });
    const sc = box.querySelector('.score');
    sc.textContent = ok === items.length ? 'Perfect! ' + ok + ' of ' + items.length : ok + ' of ' + items.length + ' correct';
    if (ok === items.length) {
      const cb = box.closest('.taskwrap').querySelector('[data-task]');
      if (cb && !cb.checked) { cb.checked = true; done.add(cb.dataset.task); saveDone(); updateProgress(cb.dataset.task); }
    }
  } else if (act === 'solutions') {
    rows.forEach((r, i) => { const s = r.querySelector('.sol'); s.hidden = false; s.textContent = items[i].a.split('|')[0]; });
  } else {
    rows.forEach(r => { const inp = r.querySelector('input'); inp.value = ''; inp.classList.remove('ok', 'bad'); r.querySelector('.sol').hidden = true; });
    box.querySelector('.score').textContent = '';
  }
});
render();
</script>

</body></html>
